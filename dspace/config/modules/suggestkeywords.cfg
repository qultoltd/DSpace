#---------------------------------------------------------------#
#------------- KEYWORD SUGGESTION CURATION TASK ----------------#
#---------------------------------------------------------------#
# Task "suggestkeywords" (org.dspace.ctask.keywords.SuggestKeywords), registered in curate.cfg.
# Suggests 0-6 subject keywords with Qwen3-4B-Instruct-2507 served by LM Studio (OpenAI-compatible API).
# Suggestions go to local.subject.suggested for a cataloguer to approve; dc.subject is never changed.
# Evaluation and design: docs/llm-pilot/dspace-integration-spec.md in the Qulto installer repository.
#
# Run:  [dspace]/bin/dspace curate -t suggestkeywords -i <handle>       (or Edit item -> Curate in the UI)
# Override any key in local.cfg; every key can also be given per run as a curation parameter.

# true (default): report the suggestions in the task result and the log, write nothing.
# Set false only after checking that both fields are hidden (metadata.hide below) and excluded from Discovery.
suggestkeywords.dry-run = true

# LM Studio: load the model with "lms load qwen3-4b-instruct-2507 --context-length 4096 --parallel 1"
# (the default of 4 parallel slots splits the context and long excerpts no longer fit).
suggestkeywords.llm.url = http://localhost:1234/v1
suggestkeywords.llm.model = qwen3-4b-instruct-2507
suggestkeywords.llm.timeout-seconds = 180

# Excerpt budget in Qwen tokens, and the maximum number of suggestions. Evaluated with 2800 and 6.
suggestkeywords.excerpt.budget-tokens = 2800
suggestkeywords.max-keywords = 6

# Languages to process. The prompt, the checks and the dictionary were evaluated for Hungarian only.
suggestkeywords.languages = hu

# Language: the metadata field first, normalised with the map below. When the field is empty, or when
# language.verify is true, the model checks the language of the text (the evaluated title-first prompt).
suggestkeywords.language.field = dc.language.iso
suggestkeywords.language.map = hun:hu, hu_hu:hu, magyar:hu, hungarian:hu, eng:en, en_us:en, angol:en, english:en, \
    ger:de, deu:de, német:de, fre:fr, fra:fr, francia:fr
suggestkeywords.language.verify = false

# Kind of document, per installation: field:value=kind, kind = fiction | literature | other.
#   fiction     skipped: no reliable topical keywords for novels, stories, drama, poetry (pilot result)
#   literature  processed (biography, essays, reportage...), genre/form words removed from the suggestions
# A homogeneous collection can be mapped as a whole: suggestkeywords.kind.collection.<collection-uuid> = fiction
# Empty by default: everything is processed as "unknown" (like "other").
#suggestkeywords.kind.rules = dc.type:regény=fiction, dc.type:novella=fiction, dc.type:vers=fiction, dc.type:dráma=fiction
suggestkeywords.kind.rules =

# Target fields (registered by registries/keyword-suggestion-types.xml).
suggestkeywords.field.suggested = local.subject.suggested
suggestkeywords.field.run = local.description.keywordrun

# Unapproved suggestions must not be public: hidden in REST/UI, RDF and OAI for non-administrators.
# (Discovery does not use these keys: both fields are also listed in toIgnoreMetadataFields in discovery.xml.)
# After changing these, rebuild the OAI index: [dspace]/bin/dspace oai import -c
metadata.hide.local.subject.suggested = true
metadata.hide.local.description.keywordrun = true
